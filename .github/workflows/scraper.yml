name: Atualizar Preços de Cervejas

on:
  schedule:
    # A cada hora cheia das 05:00 às 01:00 BRT (08:00 às 04:00 UTC)
    - cron: '0 8-23 * * *'
    - cron: '0 0-4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Executar coleta de preços e alertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scraper.main

      - name: Salvar dados atualizados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): atualiza preços ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "Nenhuma alteração nos dados."
          fi