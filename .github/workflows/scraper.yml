name: Atualizar Preços de Cervejas

on:
  schedule:
    # 08:00, 12:00, 17:00 e 21:30 no horário de Brasília (UTC-3)
    - cron: '0 11,15,20 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Executar coleta de preços e alertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scraper.main

      - name: Salvar dados atualizados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): atualiza preços ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "Nenhuma alteração nos dados."
          fi
